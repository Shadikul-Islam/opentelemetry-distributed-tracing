spring.application.name=order-service
server.port=8080

spring.datasource.url=${ORDER_DB_URL:jdbc:mysql://localhost:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${ORDER_DB_USER:order_user}
spring.datasource.password=${ORDER_DB_PASSWORD:order_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.pool-name=order-pool

inventory.base-url=${INVENTORY_SERVICE_URL:http://localhost:8081}
inventory.connect-timeout-ms=2000
inventory.read-timeout-ms=5000

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=order-service

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

logging.level.com.tracing.order=INFO
# trace_id and span_id come from the OpenTelemetry agent's MDC injection.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{trace_id:-},%X{span_id:-}] %logger{36} - %msg%n
