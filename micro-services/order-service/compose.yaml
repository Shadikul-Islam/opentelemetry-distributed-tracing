services:

  order-service:
    build:
      context: .
    image: distributed-tracing/order-service:1.0.0
    container_name: order-service
    ports:
      - "8080:8080"
    environment:
      - ORDER_DB_URL=jdbc:mysql://mysql:3306/${ORDER_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - ORDER_DB_USER=${ORDER_DB_USER}
      - ORDER_DB_PASSWORD=${ORDER_DB_PASSWORD}
      - INVENTORY_SERVICE_URL=http://inventory-service:80
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      # Required on port 4318; the agent defaults to grpc and drops spans silently.
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - OTEL_LOGS_EXPORTER=none
      - OTEL_PROPAGATORS=tracecontext,baggage
      - OTEL_RESOURCE_ATTRIBUTES=service.version=1.0.0,deployment.environment=local
    networks:
      - tracing-net
    depends_on:
      mysql:
        condition: service_healthy
      inventory-service:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  tracing-net:
    name: tracing-net
    driver: bridge
    ipam:
      config:
        - subnet: 10.28.0.0/24
